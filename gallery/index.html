<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GoldenEye Armory</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: "Segoe UI", system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #cfe8cf; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 22px; color: #d33; text-shadow: 0 0 3px #000; }
  #ammo { position: absolute; right: 24px; bottom: 16px; font-size: 42px; font-weight: 800;
    color: #fff; letter-spacing: 2px; font-family: "Arial Black", "Segoe UI", sans-serif;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  #ammo small { font-size: 16px; color: #cfe8cf; }
  #ammo .ge-reserve { color: #eee; }
  #ammo .ge-bullet { color: #f0a020; font-size: 34px; }
  #ammoL { position: absolute; left: 24px; bottom: 16px; font-size: 42px; font-weight: 800;
           color: #e8f0e8; text-shadow: 0 2px 6px #000; }
  #ammoL small { font-size: 16px; color: #cfe8cf; }
  #ammoL .ge-reserve { color: #eee; }
  #ammoL .ge-bullet { color: #f0a020; font-size: 34px; }
  #wname { position: absolute; right: 24px; bottom: 74px; font-size: 16px; color: #d9f0d9;
    text-shadow: 0 1px 3px #000; }
  #stats { position: absolute; left: 18px; top: 96px; font-size: 12px; line-height: 1.55;
    background: rgba(6,14,6,.55); padding: 10px 14px; border-radius: 6px;
    border: 1px solid rgba(120,180,120,.25); min-width: 190px; }
  #stats b { color: #fff; }
  .sbrow { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .sbl { width: 52px; color: #9aa7b5; text-align: right; }
  .sbt { width: 150px; height: 8px; background: rgba(255,255,255,0.12);
         border: 1px solid rgba(0,0,0,0.6); }
  .sbf { display: block; height: 100%;
         background: linear-gradient(90deg, #b9962e, #ffd452); }
  .sbv { color: #fff; min-width: 52px; }
  #picker { position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 92vw;
    pointer-events: auto; }
  #picker button { background: rgba(8,18,8,.7); color: #cfe8cf; border: 1px solid rgba(120,180,120,.3);
    border-radius: 4px; font-size: 11px; padding: 4px 8px; cursor: pointer; }
  #picker button.sel { background: #2c5f2c; color: #fff; border-color: #7c7; }
  #levels button { background: rgba(8,18,8,.7); color: #cfe8cf; border: 1px solid rgba(120,180,120,.3);
    border-radius: 4px; font-size: 12px; padding: 5px 12px; cursor: pointer; }
  #levels button.sel { background: #2c5f2c; color: #fff; border-color: #7c7; }
  #msg { position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
    font-size: 15px; color: #eee; text-shadow: 0 1px 3px #000; text-align: center; }
  #score { position: absolute; left: 18px; top: 14px; font-size: 14px; text-shadow: 0 1px 3px #000; }
  #hostile { position: absolute; left: 18px; top: 36px; font-size: 12px; color: #ff5a48;
             letter-spacing: 2px; text-shadow: 0 1px 3px #000; }
  #patrol { position: absolute; left: 18px; top: 54px; font-size: 12px; color: #6db2ff;
            letter-spacing: 2px; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="picker"></div>
  <div id="crosshair">+</div>
  <div id="wname"></div>
  <div id="ammo"></div>
  <div id="ammoL"></div>
  <div id="stats"></div>
  <div id="score"></div>
  <div id="hostile"></div>
  <div id="patrol"></div>
  <div id="msg"><div id="levels" style="margin-bottom:10px;pointer-events:auto">
    <button data-level="">Shooting Range</button>
    <button data-level="dam">Dam</button>
  </div><span id="entermsg">Click to enter the range</span><br>
    <span style="font-size:12px;color:#9fb99f">WASD — move &nbsp;·&nbsp; mouse — aim &nbsp;·&nbsp; click/hold — fire &nbsp;·&nbsp;
    R — reload &nbsp;·&nbsp; hold RMB — aim / zoom &nbsp;·&nbsp; wheel / [ ] — switch weapon &nbsp;·&nbsp; M — music &nbsp;·&nbsp; G — targets fire back &nbsp;·&nbsp; P — patrols &nbsp;·&nbsp; X — dual wield &nbsp;·&nbsp; - / = — volume &nbsp;·&nbsp; Esc — release mouse</span></div>
</div>
<script type="importmap">
  { "imports": { "three": "./lib/three.module.js" } }
</script>
<!-- cache-bust the module so edits always take effect during development -->
<script type="module">import("./app.js?v=" + Date.now());</script>
</body>
</html>
